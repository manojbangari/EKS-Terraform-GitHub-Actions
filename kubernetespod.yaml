---
apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/label: "eks-agent"
spec:
  serviceAccountName: jenkins
  containers:
  - name: maven
    image: maven:alpine
    command:
      - cat
    tty : true
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
  - name: jnlp
    image: jenkins/inbound-agent:latest
    resources:
      requests:
        cpu: '100m'
        memory: '256Mi'
