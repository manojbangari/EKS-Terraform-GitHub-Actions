apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/label: "eks-agent"
spec:
  serviceAccountName: jenkins
  restartPolicy: Never

  containers:
    - name: jnlp
      image: jenkins/inbound-agent:latest
      imagePullPolicy: Always
      args: ["$(JENKINS_SECRET)", "$(JENKINS_NAME)"]
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    # Optional tools container (kubectl, helm, docker, etc.)
    - name: tools
      image: bitnami/kubectl:latest
      command:
        - cat
      tty: true
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"

  # Security settings (optional)
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
