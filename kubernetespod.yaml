apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/label: "eks-agent"
spec:
  serviceAccountName: jenkins
  
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:latest
    resources:
      requests:
        cpu: '100m'
        memory: '256Mi'

  - name: node-builder
    image: node:18-alpine
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; sleep infinity & wait"]
    resources:
      limits:
        cpu: '1'
        memory: '512Mi'
      requests:
        cpu: '250m'
        memory: '256Mi'
    volumeMounts:
    - name: build-cache
      mountPath: /home/jenkins/agent/my-app/node_modules_cache
  
  volumes:
  - name: build-cache
    emptyDir: {}
