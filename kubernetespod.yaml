apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/label: "eks-agent"
serviceAccountName: jenkins
spec:
  # The first container is mandatory and acts as the connection point (J-N-L-P)
  containers:
  - name: jnlp
    image: jenkins/inbound-agent:latest
    # Define a second container with our build tools (e.g., Node.js and npm)
  - name: node-builder
    image: node:18-alpine
    command: ['sleep']
    args: ['999999']
    resources:
      limits:
        cpu: '1'
        memory: '512Mi'
      requests:
        cpu: '250m'
        memory: '256Mi'
  # Define a Volume for caching dependencies across stages
  volumes:
  - name: build-cache
    emptyDir: {}
