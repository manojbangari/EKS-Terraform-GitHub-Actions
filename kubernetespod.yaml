apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins/label: eks-agent
spec:
  serviceAccountName: jenkins
  containers:
  # JNLP agent container (required for Jenkins connection)
  - name: jnlp
    image: jenkins/inbound-agent:latest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  # Terraform + AWS CLI + git container
  - name: terraform
    image: hashicorp/terraform:light
    command:
      - cat
    tty: true
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
